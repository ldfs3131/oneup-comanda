# ONE UP Comanda — cada restaurante é <empresa>.__DOMINIO__ (certificados HTTPS: comando "oneup certificado").
# Arquivo criado pelo instalador; o certbot acrescenta as linhas de HTTPS neste mesmo bloco.
# Limite contra rajadas (login e pedidos do cardápio) — protege também os outros sistemas deste servidor
limit_req_zone $binary_remote_addr zone=oneup_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=oneup_pedido:10m rate=30r/m;

map $http_upgrade $oneup_comanda_conexao {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __DOMINIO__ *.__DOMINIO__;

    client_max_body_size 10m;

    # compressão: o cardápio abre bem mais rápido no 4G (o Nginx padrão só comprime HTML)
    gzip on;
    gzip_proxied any;
    gzip_types application/javascript text/css application/json application/manifest+json image/svg+xml text/plain;

    # pergunta interna do certificado não fica exposta na internet
    location = /api/health/tls { return 404; }

    location ~ ^/api/auth/(login|pin)$ {
        limit_req zone=oneup_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/public/orders {
        limit_req zone=oneup_pedido burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oneup_comanda_conexao;
        proxy_read_timeout 120s;
    }
}
