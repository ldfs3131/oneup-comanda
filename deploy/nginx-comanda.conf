# ONE UP Comanda — cada restaurante é <empresa>.__DOMINIO__ (certificados HTTPS: comando "oneup certificado").
# Arquivo criado pelo instalador; o certbot acrescenta as linhas de HTTPS neste mesmo bloco.
map $http_upgrade $oneup_comanda_conexao {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__ *.__DOMINIO__;

    client_max_body_size 10m;

    # pergunta interna do certificado não fica exposta na internet
    location = /api/health/tls { return 404; }

    location / {
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oneup_comanda_conexao;
        proxy_read_timeout 120s;
    }
}
